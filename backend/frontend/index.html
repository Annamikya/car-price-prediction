<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Price Prediction</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 Car Price Predictor</h1>
            <p>Enter your car details and get an accurate selling price estimate powered by machine learning</p>
        </header>

        <form id="prediction-form">
            <div class="form-group">
                <label for="present_price">Present Price (₹ Lakhs)</label>
                <input type="number" id="present_price" placeholder="e.g., 5.5" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="kms_driven">Kilometers Driven</label>
                <input type="number" id="kms_driven" placeholder="e.g., 50000" required>
            </div>

            <div class="form-group">
                <label for="car_age">Car Age (Years)</label>
                <input type="number" id="car_age" placeholder="e.g., 3" required>
            </div>

            <div class="form-group">
                <label for="fuel_type">Fuel Type</label>
                <select id="fuel_type" required>
                    <option value="" disabled selected>Select fuel type</option>
                    <option>Petrol</option>
                    <option>Diesel</option>
                    <option>CNG</option>
                </select>
            </div>

            <div class="form-group">
                <label for="seller_type">Seller Type</label>
                <select id="seller_type" required>
                    <option value="" disabled selected>Select seller type</option>
                    <option>Dealer</option>
                    <option>Individual</option>
                </select>
            </div>

            <div class="form-group">
                <label for="transmission">Transmission</label>
                <select id="transmission" required>
                    <option value="" disabled selected>Select transmission</option>
                    <option>Manual</option>
                    <option>Automatic</option>
                </select>
            </div>

            <div class="form-group">
                <label for="owner">Number of Previous Owners</label>
                <input type="number" id="owner" placeholder="e.g., 1" min="0" required>
            </div>

            <button type="submit" id="predict-btn">Predict Price</button>
        </form>

        <div id="result" class="result hidden">
            <h2>Predicted Price</h2>
            <div class="price-display">
                <span id="price-value"></span>
            </div>
        </div>

        <footer>
            <p>Powered by Machine Learning</p>
        </footer>
    </div>
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <script src="script.js"></script>
</body>
</html>
